name: Build CAD Obra APK
on:
  push:
    paths:
      - 'CADObra_Source_v0.1.zip'
      - '.github/workflows/build-cadobra.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: mkdir buildsrc && unzip -q CADObra_Source_v0.1.zip -d buildsrc
      - run: gradle assembleDebug --stacktrace
        working-directory: buildsrc
      - run: cp buildsrc/app/build/outputs/apk/debug/app-debug.apk CAD_Obra_v0.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CAD_Obra_v0.1_APK
          path: CAD_Obra_v0.1.apk
